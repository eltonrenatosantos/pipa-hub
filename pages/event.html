  <script type="module">
    import { beginPageLoad, finishPageLoad } from "../js/ui/page-loader.js?v=7";
    import { supabase } from "../js/supabase.js?v=1";
    import { recordEventView } from "../js/services/appAnalytics.js?v=1";
    import { isHighlightActiveEvent } from "../js/services/highlightLifecycle.js?v=1";
    import { showConfirmPopup, showMessagePopup } from "../js/ui/popup.js?v=5";
    import { loadFooter } from "../js/footer.js?v=1";
    import { APP_SHOW_HEADER } from "../js/header.js?v=4";
    beginPageLoad();
    if (!APP_SHOW_HEADER) document.documentElement.classList.add("app-layout--no-header");
    loadFooter("events");

    const params = new URLSearchParams(window.location.search);
    const eventId = params.get("id");

    const eventBackBtn = document.querySelector(".event-back-btn");
    if(params.get("from") === "admin" && eventBackBtn){
      eventBackBtn.href = "/pages/admin.html";
      eventBackBtn.setAttribute("aria-label", "Voltar ao painel admin");
      eventBackBtn.title = "Voltar ao painel admin";
    }

    const eventImage = document.getElementById("event-image");
    const eventImagePlaceholder = document.getElementById("event-image-placeholder");
    const eventTeamInfo = document.getElementById("event-team-info");
    const eventTitle = document.getElementById("event-title");
    const eventDate = document.getElementById("event-date");
    const eventLocation = document.getElementById("event-location");
    const eventInstagram = document.getElementById("event-instagram");
    const eventAboutCard = document.getElementById("event-about-card");
    const eventDescription = document.getElementById("event-description");
    const eventLoading = document.getElementById("event-loading");
    const eventError = document.getElementById("event-error");
    const eventContent = document.getElementById("event-content");
    const eventHeroOverlay = document.querySelector(".event-hero-overlay");
    const eventSideActions = document.querySelector(".event-side-actions");
    let eventOwnerUserId = null;
    let eventTeamName = null;

    const likeButton = document.getElementById("like-button");
    const goingButton = document.getElementById("going-button");
    const saveButton = document.getElementById("save-button");
    const instagramButton = document.getElementById("instagram-button");
    const reportButton = document.getElementById("report-button");

    const instanteEntradaPagina = Date.now();
    let interacoesClicadas = new Set();
    let agendamentoEnvioInteracao = null;
    let positiveInteractionsLocked = false;

    function lockPositiveInteractionButtons(){
      if(positiveInteractionsLocked) return;
      positiveInteractionsLocked = true;
      interacoesClicadas.clear();
      if(agendamentoEnvioInteracao){
        clearTimeout(agendamentoEnvioInteracao);
        agendamentoEnvioInteracao = null;
      }
      [likeButton, goingButton, saveButton].forEach((btn)=>{
        if(!btn) return;
        btn.classList.remove("active");
        /* Não usar disabled: em iOS/PWA o botão pode ficar invisível. Só “apagar” + bloquear clique. */
        btn.setAttribute("aria-disabled", "true");
        btn.setAttribute("tabindex", "-1");
      });
      eventSideActions?.classList.add("event-side-actions--positive-locked");
    }

    function formatDate(value){
      if(!value) return "Data não informada";
      const date = new Date(`${value}T12:00:00`);
      if(Number.isNaN(date.getTime())) return value;
      return `${String(date.getDate()).padStart(2, "0")}/${String(date.getMonth() + 1).padStart(2, "0")}/${String(date.getFullYear()).slice(2)}`;
    }

    function sanitizeAddressPart(value){
      const withoutCep = String(value || "").replace(/\b\d{5}-?\d{3}\b/g, "").trim();
      if(withoutCep.includes(" - ")){
        return withoutCep.split(" - ")[0].trim();
      }
      return withoutCep;
    }

    function formatEventAddress(location, city){
      const normalizedCity = String(city || "").trim().toLowerCase();
      const parts = String(location || "")
        .split(",")
        .map((part) => sanitizeAddressPart(part.trim()))
        .filter(Boolean)
        .filter((part) => part.toLowerCase() !== "brasil")
        .filter((part) => !normalizedCity || part.toLowerCase() !== normalizedCity)
        .slice(0, 3);

      if(city && String(city).trim()){
        parts.push(String(city).trim());
      }

      return parts.join(", ");
    }

    function normalizeInstagram(value){
      if(!value) return { label: "Instagram não informado", href: "#" };
      const clean = value.replace(/^@/, "").trim();
      return {
        label: `@${clean}`,
        href: `https://instagram.com/${clean}`
      };
    }

    function normalizeReportErrorMessage(rawMessage){
      const lowerMessage = String(rawMessage || "").toLowerCase();

      if(lowerMessage.includes("duplicate report")) return "Você já denunciou este evento.";
      if(lowerMessage.includes("self report is not allowed")) return "Você não pode denunciar um evento publicado por você.";
      if(lowerMessage.includes("same team report is not allowed")) return "Você não pode denunciar um evento da sua própria equipe.";
      if(lowerMessage.includes("custom reason required")) return "Escreva o motivo da denúncia antes de enviar.";
      if(lowerMessage.includes("event is not available for reports")) return "Este evento não está mais disponível para denúncia.";
      if(lowerMessage.includes("event owner not found")) return "Não foi possível identificar o responsável por este evento.";
      if(lowerMessage.includes("event not found")) return "Não foi possível identificar o evento para denúncia.";
      if(lowerMessage.includes("not authenticated")) return "Você precisa entrar para denunciar um evento.";
      if(lowerMessage.includes("invalid report reason")) return "Escolha um motivo válido para a denúncia.";

      return rawMessage || "Não foi possível enviar sua denúncia agora.";
    }

    function showUnavailableState(message){
      if(eventLoading) eventLoading.classList.add("hidden");
      if(eventContent) eventContent.classList.add("hidden");
      if(eventError){
        eventError.textContent = message;
        eventError.classList.remove("hidden");
      }
      if(eventHeroOverlay) eventHeroOverlay.classList.add("hidden");
      if(eventSideActions) eventSideActions.classList.add("hidden");
      if(eventImage) eventImage.classList.add("hidden");
      if(eventImagePlaceholder){
        eventImagePlaceholder.textContent = message;
        eventImagePlaceholder.classList.remove("hidden");
      }
    }

    async function loadEvent(){
      if(!eventId){
        showUnavailableState("Evento não encontrado.");
        return;
      }

      const { data: isAdminRpc, error: adminRpcError } = await supabase.rpc("is_current_user_admin");
      const isAdminViewer = Boolean(isAdminRpc) && !adminRpcError;

      let query = supabase
        .from("events")
        .select("id,team,title,city,location,date,instagram,image,user_id,description,plan_type,payment_status,created_at,highlight_started_at")
        .eq("id", eventId);

      if(!isAdminViewer){
        query = query.in("payment_status", ["paid", "approved"]);
      }

      const { data, error } = await query.maybeSingle();

      if(error || !data){
        console.error("Erro ao carregar evento:", error);
        showUnavailableState("Não foi possível carregar este evento.");
        return;
      }

      eventLoading.classList.add("hidden");
      if(eventError) eventError.classList.add("hidden");
      if(eventHeroOverlay) eventHeroOverlay.classList.remove("hidden");
      if(eventSideActions) eventSideActions.classList.remove("hidden");

      const instagram = normalizeInstagram(data.instagram || "");
      const city = String(data.city || "").trim();
      const locationText = formatEventAddress(data.location, city) || "Endereço não informado";
      const descriptionText = (data.description || "").trim();
      const isFeaturedEvent = isHighlightActiveEvent(data);
      eventOwnerUserId = data.user_id || null;
      eventTeamName = data.team || null;

      if(eventAboutCard && eventDescription){
        if(isFeaturedEvent && descriptionText){
          eventDescription.textContent = descriptionText;
          eventAboutCard.classList.remove("hidden");
        }else{
          eventDescription.textContent = "";
          eventAboutCard.classList.add("hidden");
        }
      }

      eventTeamInfo.textContent = data.team || "Equipe não informada";
      eventTitle.textContent = data.title || "Evento";
      eventDate.textContent = formatDate(data.date);
      eventLocation.textContent = locationText;
      eventInstagram.textContent = instagram.label;
      eventInstagram.href = instagram.href;
      if(instagramButton){
        const hasInstagram = instagram.href && instagram.href !== "#";
        instagramButton.classList.toggle("hidden", !hasInstagram);
      }

      if(data.image){
        eventImage.src = data.image;
        eventImage.classList.remove("hidden");
        eventImagePlaceholder.classList.add("hidden");
      }else{
        eventImage.classList.add("hidden");
        eventImagePlaceholder.classList.remove("hidden");
      }

      eventContent.classList.remove("hidden");
      loadExistingInteractions();
      recordEventView(eventId).catch(() => {});
    }
async function isUserFromEventTeam(userId){
  if(!userId || !eventTeamName) return false;

  try {
    const normalizedEventTeamName = String(eventTeamName).trim().toLowerCase();

    const { data: memberships, error: membershipsError } = await supabase
      .from("team_members")
      .select("team_id,status")
      .eq("user_id", userId)
      .eq("status", "approved");

    if(membershipsError){
      console.error("Erro ao verificar memberships do usuário:", membershipsError);
      return false;
    }

    const teamIds = (memberships || []).map(item => item.team_id).filter(Boolean);
    if(teamIds.length === 0) return false;

    const { data: teamsData, error: teamsError } = await supabase
      .from("teams")
      .select("id,name")
      .in("id", teamIds);

    if(teamsError){
      console.error("Erro ao verificar equipes do usuário:", teamsError);
      return false;
    }

    return (teamsData || []).some(team => {
      const normalizedTeamName = String(team.name || "").trim().toLowerCase();
      return normalizedTeamName === normalizedEventTeamName;
    });
  } catch (error) {
    console.error("Erro ao validar equipe da denúncia:", error);
    return false;
  }
}

async function getReportBlockReason(userId){
  if(!userId) return null;

  if(eventOwnerUserId && userId === eventOwnerUserId){
    return "Você não pode denunciar um evento criado por você.";
  }

  if(await isUserFromEventTeam(userId)){
    return "Você não pode denunciar um evento da sua própria equipe.";
  }

  return null;
}



async function loadExistingInteractions(){
  const { data: { user } } = await supabase.auth.getUser();
  if(!user) return;

  const { data: existingReport } = await supabase
    .from("event_reports")
    .select("id")
    .eq("event_id", eventId)
    .eq("user_id", user.id)
    .maybeSingle();

  if(existingReport){
    reportButton.classList.add("active");
    lockPositiveInteractionButtons();
    return;
  }

  const { data } = await supabase
    .from("event_interactions")
    .select("type")
    .eq("event_id", eventId)
    .eq("user_id", user.id);

  if(!data) return;

  data.forEach((row) => {
    if(row.type === "like") likeButton.classList.add("active");
    if(row.type === "going") goingButton.classList.add("active");
    if(row.type === "save") saveButton.classList.add("active");
  });
}
// ===== Tempo mínimo na página antes de enviar interações =====

async function enviarInteracoes(){
  if(positiveInteractionsLocked) return;

  const tempoNaPaginaSegundos = (Date.now() - instanteEntradaPagina) / 1000;
  if(tempoNaPaginaSegundos < 8) return;

  if(interacoesClicadas.size === 0) return;

  const { data: { user } } = await supabase.auth.getUser();
  if(!user) return;

  // INT (raw): no máximo +0,1 por usuário por evento (só na primeira interação nova).
  // Curtir / vou / salvar continuam gravando para a UI; os tipos extras não chamam add_interaction_raw.
  const { count: totalInteracoesEventoAntes, error: erroAoContarInteracoes } = await supabase
    .from("event_interactions")
    .select("*", { count: "exact", head: true })
    .eq("event_id", eventId)
    .eq("user_id", user.id);

  if(erroAoContarInteracoes){
    console.error("Erro ao contar interações do evento:", erroAoContarInteracoes);
  }

  const eventoJaTinhaAlgumaInteracao = (totalInteracoesEventoAntes ?? 0) > 0;
  let pontosFracionadosJaEnviadosNesteEnvio = eventoJaTinhaAlgumaInteracao;

  for(const tipo of interacoesClicadas){
    const { data: jaExistia, error: erroBuscaExistente } = await supabase
      .from("event_interactions")
      .select("id")
      .eq("event_id", eventId)
      .eq("user_id", user.id)
      .eq("type", tipo)
      .maybeSingle();

    if(erroBuscaExistente){
      console.error("Erro ao verificar interação existente:", erroBuscaExistente);
      continue;
    }

    if(jaExistia) continue;

    const { error: erroInserir } = await supabase
      .from("event_interactions")
      .insert({
        event_id: eventId,
        user_id: user.id,
        type: tipo
      });

    if(erroInserir){
      console.error("Erro ao salvar interação:", erroInserir);
      continue;
    }

    if(pontosFracionadosJaEnviadosNesteEnvio) continue;

    pontosFracionadosJaEnviadosNesteEnvio = true;
    const { error: erroInteracaoFracionada } = await supabase.rpc("add_interaction_raw", {
      p_user_id: user.id,
      p_raw_to_add: 0.1
    });

    if(erroInteracaoFracionada){
      console.error("Erro ao somar interação fracionada:", erroInteracaoFracionada);
    }
  }
}

function agendarEnvioInteracoes(){
  if(positiveInteractionsLocked) return;
  if(interacoesClicadas.size === 0) return;

  if(agendamentoEnvioInteracao){
    clearTimeout(agendamentoEnvioInteracao);
    agendamentoEnvioInteracao = null;
  }

  const milissegundosDecorridos = Date.now() - instanteEntradaPagina;
  const esperaMinimaMs = 8000;

  if(milissegundosDecorridos >= esperaMinimaMs){
    enviarInteracoes();
    return;
  }

  agendamentoEnvioInteracao = setTimeout(()=>{
    enviarInteracoes();
  }, esperaMinimaMs - milissegundosDecorridos);
}

function registrarInteracaoLocal(tipo){
  if(interacoesClicadas.has(tipo)) return;
  interacoesClicadas.add(tipo);
}

likeButton.addEventListener("click", ()=>{
  if(positiveInteractionsLocked) return;
  if(likeButton.classList.contains("active")) return;
  likeButton.classList.add("active");
  registrarInteracaoLocal("like");
  agendarEnvioInteracoes();
});

goingButton.addEventListener("click", ()=>{
  if(positiveInteractionsLocked) return;
  if(goingButton.classList.contains("active")) return;
  goingButton.classList.add("active");
  registrarInteracaoLocal("going");
  agendarEnvioInteracoes();
});

saveButton.addEventListener("click", ()=>{
  if(positiveInteractionsLocked) return;
  if(saveButton.classList.contains("active")) return;
  saveButton.classList.add("active");
  registrarInteracaoLocal("save");
  agendarEnvioInteracoes();
});

const reportModal = document.getElementById("report-modal");
const closeReportModal = document.getElementById("close-report-modal");
const reasonInputs = document.querySelectorAll('input[name="report-reason"]');
const customReason = document.getElementById("report-custom-reason");
const customReasonRadio = document.getElementById("report-reason-custom");
const sendReportBtn = document.getElementById("send-report-btn");

reportButton.addEventListener("click", async ()=>{
  const { data: { user } } = await supabase.auth.getUser();

  const blockReason = await getReportBlockReason(user?.id || null);
  if(blockReason){
    showMessagePopup({ message: blockReason });
    return;
  }

  if(reportButton.classList.contains("active")){
    showMessagePopup({ message: "Este evento já foi denunciado por você." });
    return;
  }

  reportModal.classList.remove("hidden");
  reportModal.style.display = "flex";
});

if(instagramButton){
  instagramButton.addEventListener("click", ()=>{
    const href = eventInstagram?.href;
    if(href && href !== "#"){
      window.open(href, "_blank", "noopener,noreferrer");
    }
  });
}

closeReportModal.onclick = ()=>{
  reportModal.classList.add("hidden");
  reportModal.style.display = "none";
};

customReason.addEventListener("focus", ()=>{
  if(customReasonRadio) customReasonRadio.checked = true;
});

async function countConsecutiveRejectedReports(userId){
  const { data, error } = await supabase
    .from("event_reports")
    .select("status,reviewed_at")
    .or(`reporter_user_id.eq.${userId},user_id.eq.${userId}`)
    .in("status", ["accepted", "rejected"])
    .not("reviewed_at", "is", null)
    .order("reviewed_at", { ascending: false })
    .limit(40);

  if(error || !data?.length) return 0;

  let streak = 0;
  for(const row of data){
    if(row.status === "rejected") streak++;
    else break;
  }
  return streak;
}

sendReportBtn.onclick = async ()=>{

  const { data: { user } } = await supabase.auth.getUser();
  if(!user) return;

  const blockReason = await getReportBlockReason(user.id);
  if(blockReason){
    reportModal.classList.add("hidden");
    reportModal.style.display = "none";
    showMessagePopup({ message: blockReason });
    return;
  }

  const { data: existingReport, error: existingReportError } = await supabase
    .from("event_reports")
    .select("id")
    .eq("event_id", eventId)
    .eq("user_id", user.id)
    .maybeSingle();

  if(existingReportError){
    console.error(existingReportError);
    showMessagePopup({ message: "Erro ao verificar denúncia existente." });
    return;
  }

  if(existingReport){
    reportButton.classList.add("active");
    lockPositiveInteractionButtons();
    reportModal.classList.add("hidden");
    reportModal.style.display = "none";
    showMessagePopup({ message: "Este evento já foi denunciado por você." });
    return;
  }

  let reason = null;

  reasonInputs.forEach(r=>{
    if(r.checked) reason = r.value;
  });

  const customReasonText = customReason.value.trim();

  if(!reason){
    showMessagePopup({ message: "Selecione ou escreva um motivo." });
    return;
  }

  if(reason === "outro" && !customReasonText){
    showMessagePopup({ message: "Escreva o motivo da denúncia antes de enviar." });
    return;
  }

  const runSubmit = async ()=>{
    const { error } = await supabase.rpc("submit_event_report", {
      p_event_id: eventId,
      p_reason: reason,
      p_custom_reason: customReasonText
    });

    if(error){
      console.error(error);
      showMessagePopup({ message: normalizeReportErrorMessage(error.message || error.details || "Erro ao enviar denúncia.") });
      return;
    }

    reportButton.classList.add("active");
    lockPositiveInteractionButtons();
    reportModal.classList.add("hidden");
    reportModal.style.display = "none";
    showMessagePopup({ message: "Denúncia enviada." });
  };

  const streak = await countConsecutiveRejectedReports(user.id);
  if(streak >= 3){
    showConfirmPopup({
      title: "Atenção",
      message:
        "Suas últimas três denúncias foram recusadas. Esta denúncia será analisada com critério. Se for recusada, você sofrerá uma penalização.",
      confirmLabel: "Enviar denúncia",
      cancelLabel: "Cancelar",
      bottomSheet: true,
      align: "left",
      onConfirm: runSubmit
    });
    return;
  }

  await runSubmit();
};

// Envio extra após 15 s se o usuário continuar na página
setTimeout(()=>{
  enviarInteracoes();
},15000);

// Envia ao esconder a aba ou sair da página
window.addEventListener("pagehide", enviarInteracoes);
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden){
    enviarInteracoes();
  }
});
