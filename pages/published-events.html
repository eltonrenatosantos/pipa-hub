<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>document.documentElement.classList.add('app-preload');</script>

<title>Eventos publicados</title>

<link rel="stylesheet" href="../assets/css/global.css?v=9" />
  <link rel="stylesheet" href="../assets/css/components.css?v=1" />
  <link rel="stylesheet" href="../assets/css/pages.css?v=7" />
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b0b0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="WebPipa">
</head>

<body>
<div id="app-header"></div>

<section class="published-events-page">
  <div class="profile-panel published-events-stack">
    <button type="button" id="published-events-back-admin" class="admin-back-btn" hidden aria-label="Voltar ao painel admin" title="Voltar ao painel admin">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div>
      <div class="profile-panel-title">Eventos publicados</div>
      <div class="published-events-intro">
        Lista de eventos; no modo admin aparecem todos os cadastros.
      </div>
    </div>

    <div id="published-events-list" class="published-events-list">
      <div class="published-events-empty">Carregando eventos...</div>
    </div>
  </div>
</section>

<div id="app-footer"></div>

<script type="module">
import { loadFooter } from "../js/footer.js?v=1";
loadFooter("profile");
</script>

<script type="module">
import { beginPageLoad, finishPageLoad } from "../js/ui/page-loader.js?v=7";
import { loadHeader } from "../js/header.js?v=4";
import { supabase } from "../js/supabase.js?v=1";
import { loadAllEventsForAdmin } from "../js/services/home.js?v=2";
import { loadPublishedProfileEvents } from "../js/services/profile.js?v=6";
import { isHighlightActiveEvent } from "../js/services/highlightLifecycle.js?v=1";
import { runHighlightUpgradeFlow } from "../js/profile-event-upgrade.js?v=8";
import {
  showPopup,
  closePopup,
  showConfirmPopup,
  showMessagePopup,
} from "../js/ui/popup.js?v=1";
beginPageLoad();

const list = document.getElementById("published-events-list");
const titleEl = document.querySelector(".profile-panel-title");
const introEl = document.querySelector(".published-events-intro");
let isAdminCatalog = false;
/** Última lista carregada (para abrir edição com dados completos). */
let lastLoadedEvents = [];

function escapeHtml(text){
  return String(text ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/"/g, "&quot;");
}

function escapeHtmlAttr(text){
  return String(text ?? "")
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;");
}

const ICON_PENCIL = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>`;
const ICON_TRASH = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>`;

function formatEventDateShort(dateValue){
  if(!dateValue) return "";
  const base = String(dateValue).slice(0, 10);
  const parts = base.split("-");
  if(parts.length !== 3) return "";
  return `${parts[2]}/${parts[1]}/${parts[0].slice(2)}`;
}

function renderEmpty(message){
  if(!list) return;
  list.innerHTML = `<div class="published-events-empty">${message}</div>`;
}

function isPremiumEventPlan(eventOrPlan){
  if(eventOrPlan && typeof eventOrPlan === "object"){
    return isHighlightActiveEvent(eventOrPlan);
  }
  return false;
}

function isFreeEventPlan(eventOrPlan){
  return !isPremiumEventPlan(eventOrPlan);
}

function publishedTrailHtml(event){
  if(isAdminCatalog){
    return "";
  }
  const ps = String(event.payment_status || "").trim().toLowerCase();
  if(ps === "rejected"){
    return `
      <div class="activity-event-icon activity-event-icon--rejected" role="status" aria-live="polite">
        <svg class="activity-event-rejected-x" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
        <span class="activity-event-rejected-label">Rejeitado</span>
      </div>`;
  }
  const awaiting = String(event.payment_status || "") === "awaiting_payment";
  if(awaiting){
    return `
      <div class="activity-event-icon is-highlight-btn activity-event-icon--awaiting" role="status" aria-live="polite">
        <span class="activity-event-awaiting-label">Aguardando aprovação</span>
      </div>`;
  }
  if(isPremiumEventPlan(event)){
    return `
      <div class="activity-event-icon activity-event-icon--destaque" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="13" height="13" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path fill="currentColor" d="M12 5.5l1.4 4.1h4.4l-3.5 2.6 1.3 4.2-3.6-2.2-3.6 2.2 1.3-4.2-3.5-2.6h4.4L12 5.5z"/>
        </svg>
      </div>`;
  }
  if(!isFreeEventPlan(event)){
    return "";
  }
  const id = event.id || "";
  return `
    <div class="activity-event-icon is-highlight-btn">
      <button type="button" class="activity-event-destacar-btn app-button app-button-primary app-button-mini" data-event-id="${id}" aria-label="Destacar evento com plano pago">Destacar</button>
    </div>`;
}

function eventPageUrl(eventId){
  const id = encodeURIComponent(String(eventId));
  return isAdminCatalog
    ? `/pages/event.html?id=${id}&from=admin`
    : `/pages/event.html?id=${id}`;
}

function renderEvents(events){
  if(!list) return;

  list.innerHTML = events.map((event)=>{
    const formattedDate = formatEventDateShort(event.date);
    const awaitingPay = String(event.payment_status || "") === "awaiting_payment";
    const isPremium = isPremiumEventPlan(event);
    const isClickable = isAdminCatalog || isPremium;
    const locationLabel = event.city || event.location || "Local não informado";
    const isRowGold = isPremium && !awaitingPay;
    const id = event.id ?? "";
    const thumbImg = event.image
      ? `<img src="${escapeHtmlAttr(event.image)}" alt="${escapeHtmlAttr(event.title || "Evento")}">`
      : "";

    const isRejected = String(event.payment_status || "").trim().toLowerCase() === "rejected";

    if(isAdminCatalog){
      return `
        <div class="activity-event-item activity-event-item--admin-row is-static${isRowGold ? " activity-event-item--highlighted" : ""}${isRejected ? " activity-event-item--rejected" : ""}" data-event-id="${id}">
          <button type="button" class="activity-event-main-tap" data-event-id="${id}">
            <div class="activity-event-thumb">${thumbImg}</div>
            <div class="activity-event-copy">
              <div class="activity-event-title">${escapeHtml(event.title || "Evento")}</div>
              <div class="activity-event-location">${escapeHtml(locationLabel)}</div>
              <div class="activity-event-meta">${escapeHtml(formattedDate || "Data não informada")}${isRejected ? ` <span class="published-events-status-pill">Rejeitado</span>` : ""}</div>
            </div>
          </button>
          <div class="activity-event-admin-tools">
            <button type="button" class="published-events-icon-btn" data-admin-action="edit" data-event-id="${id}" aria-label="Editar evento">${ICON_PENCIL}</button>
            <button type="button" class="published-events-icon-btn published-events-icon-btn--danger" data-admin-action="delete" data-event-id="${id}" aria-label="Excluir evento">${ICON_TRASH}</button>
          </div>
        </div>
      `;
    }

    const tagName = isClickable ? "button" : "div";
    return `
      <${tagName} ${isClickable ? 'type="button"' : ""} class="activity-event-item${isClickable ? "" : " is-static"}${isRowGold ? " activity-event-item--highlighted" : ""}" data-event-id="${id}">
        <div class="activity-event-thumb">${thumbImg}</div>
        <div class="activity-event-copy">
          <div class="activity-event-title">${escapeHtml(event.title || "Evento")}</div>
          <div class="activity-event-location">${escapeHtml(locationLabel)}</div>
          <div class="activity-event-meta">${escapeHtml(formattedDate || "Data não informada")}</div>
        </div>
        ${publishedTrailHtml(event)}
      </${tagName}>
    `;
  }).join("");

  list.querySelectorAll(".activity-event-main-tap").forEach((btn)=>{
    btn.addEventListener("click", ()=>{
      const eventId = btn.dataset.eventId;
      if(!eventId) return;
      window.location.href = eventPageUrl(eventId);
    });
  });

  list.querySelectorAll(".activity-event-item:not(.activity-event-item--admin-row)").forEach((row)=>{
    if(row.classList.contains("is-static")) return;
    if(row.classList.contains("activity-event-item--admin-row")) return;
    row.addEventListener("click", ()=>{
      const eventId = row.dataset.eventId;
      if(!eventId) return;
      window.location.href = eventPageUrl(eventId);
    });
  });

  list.querySelectorAll('[data-admin-action="edit"]').forEach((btn)=>{
    btn.addEventListener("click", (e)=>{
      e.preventDefault();
      e.stopPropagation();
      const eventId = btn.dataset.eventId;
      const ev = lastLoadedEvents.find((item) => String(item.id) === String(eventId));
      if(ev) openEditEventModal(ev);
    });
  });

  list.querySelectorAll('[data-admin-action="delete"]').forEach((btn)=>{
    btn.addEventListener("click", (e)=>{
      e.preventDefault();
      e.stopPropagation();
      const eventId = btn.dataset.eventId;
      if(eventId) confirmDeleteEvent(eventId);
    });
  });

  list.querySelectorAll(".activity-event-destacar-btn").forEach((btn)=>{
    btn.addEventListener("click", async (e)=>{
      e.preventDefault();
      e.stopPropagation();
      const id = btn.dataset.eventId;
      if(!id) return;
      btn.disabled = true;
      try{
        await runHighlightUpgradeFlow(id);
        await loadPublishedEventsPage();
      }catch(err){
        console.error(err);
        alert(err?.message || "Não foi possível iniciar o destaque.");
      }finally{
        btn.disabled = false;
      }
    });
  });
}

function dateInputValue(raw){
  if(!raw) return "";
  const s = String(raw).slice(0, 10);
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const d = new Date(raw);
  if(Number.isNaN(d.getTime())) return "";
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function openEditEventModal(event){
  const eventId = event.id;
  const titleVal = escapeHtmlAttr(event.title || "");
  const imageVal = escapeHtmlAttr(event.image || "");
  const cityVal = escapeHtmlAttr(event.city || "");
  const dateVal = dateInputValue(event.date);

  const { overlay } = showPopup({
    title: "Editar evento",
    align: "left",
    compact: false,
    closeOnBackdrop: true,
    popupClass: "published-events-edit-popup",
    bodyClass: "app-popup-body",
    html: `
      <div class="published-events-edit-fields">
        <label for="pe-edit-title">Nome do evento</label>
        <input id="pe-edit-title" type="text" value="${titleVal}" autocomplete="off" />
        <label for="pe-edit-image">URL da foto</label>
        <input id="pe-edit-image" type="text" value="${imageVal}" placeholder="https://..." inputmode="url" />
        <label for="pe-edit-city">Cidade</label>
        <input id="pe-edit-city" type="text" value="${cityVal}" />
        <label for="pe-edit-location">Endereço / local</label>
        <textarea id="pe-edit-location" rows="2">${escapeHtml(event.location || "")}</textarea>
        <label for="pe-edit-date">Data do evento</label>
        <input id="pe-edit-date" type="date" value="${dateVal}" />
      </div>
    `,
    actions: `
      <button class="app-popup-button" type="button" data-role="save-edit">Salvar</button>
      <button class="app-popup-button app-popup-secondary" type="button" data-role="cancel-edit">Cancelar</button>
    `,
  });

  const titleInput = overlay.querySelector("#pe-edit-title");
  const imageInput = overlay.querySelector("#pe-edit-image");
  const cityInput = overlay.querySelector("#pe-edit-city");
  const locationInput = overlay.querySelector("#pe-edit-location");
  const dateInput = overlay.querySelector("#pe-edit-date");

  overlay.querySelector('[data-role="cancel-edit"]')?.addEventListener("click", () => {
    closePopup(overlay);
  });

  overlay.querySelector('[data-role="save-edit"]')?.addEventListener("click", async () => {
    const title = (titleInput?.value || "").trim();
    if(!title){
      showMessagePopup({ title: "Atenção", message: "Informe o nome do evento.", compact: true });
      return;
    }
    const image = (imageInput?.value || "").trim();
    const city = (cityInput?.value || "").trim();
    const location = (locationInput?.value || "").trim();
    const dateStr = (dateInput?.value || "").trim();

    const payload = {
      title,
      image: image || null,
      city: city || null,
      location: location || null,
    };
    if(dateStr) payload.date = dateStr;

    const { error } = await supabase.from("events").update(payload).eq("id", eventId);

    if(error){
      console.error(error);
      showMessagePopup({
        title: "Erro ao salvar",
        message: error.message || "Não foi possível atualizar o evento.",
        compact: true,
      });
      return;
    }

    closePopup(overlay);
    showMessagePopup({ title: "Salvo", message: "Evento atualizado.", compact: true });
    await loadPublishedEventsPage();
  });
}

function confirmDeleteEvent(eventId){
  showConfirmPopup({
    title: "Excluir evento?",
    message: "Tem certeza que deseja excluir este evento? Esta ação não pode ser desfeita.",
    confirmLabel: "Excluir",
    cancelLabel: "Cancelar",
    compact: true,
    onConfirm: async () => {
      const { error } = await supabase.from("events").delete().eq("id", eventId);
      if(error){
        console.error(error);
        showMessagePopup({
          title: "Erro",
          message: error.message || "Não foi possível excluir.",
          compact: true,
        });
        return;
      }
      showMessagePopup({ title: "Removido", message: "Evento excluído.", compact: true });
      await loadPublishedEventsPage();
    },
  });
}

async function loadPublishedEventsPage(){
  renderEmpty("Carregando eventos...");

  let events;
  try {
    if(isAdminCatalog){
      events = await loadAllEventsForAdmin();
      if(titleEl) titleEl.textContent = "Editar eventos";
      if(introEl){
        introEl.textContent =
          "Todos os eventos cadastrados (incluindo gratuitos pendentes). A home só mostra aprovados/pagos.";
      }
      document.title = "Editar eventos — WebPipa";
    }else{
      events = await loadPublishedProfileEvents();
      if(titleEl) titleEl.textContent = "Eventos publicados";
      if(introEl){
        introEl.textContent = "Acompanhe os eventos enviados pela sua conta, como no perfil do app.";
      }
      document.title = "Eventos publicados — WebPipa";
    }
  } catch (error) {
    console.error(error);
    renderEmpty("Não foi possível carregar os eventos.");
    return;
  }

  if(events === null){
    renderEmpty("Você precisa estar logado para ver seus eventos publicados.");
    return;
  }

  if(!events.length){
    renderEmpty(
      isAdminCatalog
        ? "Nenhum evento cadastrado."
        : "Você ainda não publicou eventos."
    );
    return;
  }

  lastLoadedEvents = Array.isArray(events) ? events : [];
  renderEvents(events);
}

const backAdminBtn = document.getElementById("published-events-back-admin");

try {
  const { data: adminRpc, error: adminErr } = await supabase.rpc("is_current_user_admin");
  isAdminCatalog = Boolean(adminRpc) && !adminErr;
  await loadHeader(isAdminCatalog ? "Editar eventos" : "Eventos publicados");
  await loadPublishedEventsPage();

  if(backAdminBtn){
    backAdminBtn.hidden = !isAdminCatalog;
    backAdminBtn.addEventListener("click", ()=>{
      window.location.href = "/pages/admin.html";
    });
  }
} finally {
  finishPageLoad();
}
</script>

<script type="module" src="../js/pwa.js?v=5"></script>

</body>
</html>
